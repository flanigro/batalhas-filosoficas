<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalha dos Filósofos — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BATALHAS FILOSÓFICAS — rodada visual 1 (Ágora)
   Layout: página ao anoitecer; no centro, a Ágora no fim da tarde. Piso de mármore inclinado
   (CSS 3D, sem biblioteca): oponentes ao fundo, tribunas no meio, o jogador na frente.
   Cartas e tribunas ficam de pé sobre o piso. A mão fica fora do piso, plana, como painel.

   PALETA
   --marmore / --marmore2 / --veio   piso, lápides, plintos
   --tinta / --tinta2                texto sobre mármore
   --ouro / --ouro2                  vitória, linha do valor, louros
   --egeu                            destaque frio: seleção e alvos
   --vinho                           carimbo de falácia
   --ceu1..4                         céu, do horizonte ao alto
   --pc                              cor do jogador (vem do motor): livros, pontos, contornos
   As variáveis antigas (--ink, --mute, --gold…) seguem valendo nas telas escuras (diário, telas centrais).

   MOVIMENTO  (nas cenas, toda duração passa por T() de coreo.js; "Ritmo: rápido" divide por 2)
   micro 140ms   passar o mouse, acender alvo
   curto 280ms   livro que cai na torre, balão que entra
   médio 520ms   voo de carta ou de livro, carimbo
   longo 900ms+  cerimônias (louros, placa que vai para a prateleira)
   --saida   cubic-bezier(.16,1,.3,1)    chegar e assentar (padrão)
   --tranco  cubic-bezier(.3,1.6,.5,1)   pouso com peso, carimbo, pulo do coro
   --queda   cubic-bezier(.6,0,.9,.3)    cair, sair de cena
   Regras: uma coisa grande por vez; tremor da mesa de no máximo 6px e 320ms; nada encosta num
   filósofo (o alvo de um golpe é torre, espantalho ou lápide); prefers-reduced-motion corta tudo.

   3D  --tilt é a inclinação do piso. Tudo que fica de pé (.seat, .trib) desfaz a inclinação com
   rotateX(calc(-1*var(--tilt))) pela base. Não ponha overflow, filter ou opacity nos elementos entre
   .plano e eles: isso achata a cena.
   ============================================================ */
:root{
  color-scheme:light;
  --marmore:#efeae0; --marmore2:#dcd5c6; --veio:#c9c0ae; --pedra:#9a917f;
  --tinta:#26221c; --tinta2:#6a6253; --ouro:#c8962a; --ouro2:#8a6510; --egeu:#1f6f8f; --vinho:#9c2b35;
  --ceu1:#fbdca6; --ceu2:#f1a970; --ceu3:#8f6f9e; --ceu4:#3a4577;
  --saida:cubic-bezier(.16,1,.3,1); --tranco:cubic-bezier(.3,1.6,.5,1); --queda:cubic-bezier(.6,0,.9,.3);
  --tilt:24deg; --hz:150px;
  --bg:#1c2140; --line:rgba(255,255,255,.14); --ink:#f1ead9; --mute:#aab0c4;
  --gold:#e9b93f; --gold2:#b8902f; --paper:#f4ecd6; --paperink:#231f18; --wood:#6b4a2a; --wood2:#4a321b;
  --meta:#d8483c; --logica:#2f8fd0; --etica:#2c9a4b; --psico:#a13a9b;
  --serif:'Alegreya',Georgia,serif; --sans:'Alegreya Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,#262c52 0,var(--bg) 420px) fixed var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.35;-webkit-user-select:none;user-select:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--egeu);outline-offset:2px}

header{display:flex;align-items:center;gap:16px;padding:9px 20px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-weight:900;font-size:26px;margin:0;letter-spacing:.4px;color:#f6d98a}
header h1 small{font-family:var(--sans);font-weight:700;font-size:11px;color:var(--mute);margin-left:10px;text-transform:uppercase;letter-spacing:1.4px}
.hstat{margin-left:auto;display:flex;gap:12px;align-items:center;color:var(--mute);font-size:14px;flex-wrap:wrap}
.hstat b{color:var(--ink)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;background:#30375e;border:1px solid #515a88}
.pips i.on{background:var(--gold);border-color:#fff3c4}
.pips i.at{box-shadow:0 0 0 2px rgba(233,185,63,.45)}
.btn{background:linear-gradient(180deg,#faf7f0,#e2dbcc);border:1px solid #a89f8c;border-bottom:3px solid #8d8472;border-radius:9px;padding:7px 13px;font-weight:800;color:var(--tinta)}
.btn:hover:not(:disabled){border-color:var(--egeu);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px);border-bottom-width:1px}
.btn.pri{background:linear-gradient(180deg,#f3cf6c,#d6a430);color:#221a05;border-color:#b98a1e;border-bottom-color:var(--ouro2)}
.btn.sm{padding:4px 9px;font-size:13px;border-bottom-width:2px}

main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:4px 18px 18px;max-width:1540px;margin:0 auto}
@media(max-width:1060px){main{grid-template-columns:1fr}}

/* ---------- a Ágora ---------- */
.mesa{position:relative;min-width:0;border-radius:20px;overflow:hidden;border:3px solid #b98a1e;color:var(--tinta);
  background:linear-gradient(180deg,var(--ceu4) 0,var(--ceu3) 52px,var(--ceu2) 112px,var(--ceu1) var(--hz),#c9b78f var(--hz),#b7a47d 46%,#a8956f 100%);
  box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,236,170,.25)}
.fundo{position:absolute;inset:0 0 auto 0;height:calc(var(--hz) + 120px);pointer-events:none}
.sol{position:absolute;left:68%;top:calc(var(--hz) - 62px);width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0,#ffd98a 38%,rgba(255,190,110,.35) 60%,transparent 72%)}
.monte{position:absolute;left:0;right:0;top:calc(var(--hz) - 34px);height:36px;background:#8b7797;clip-path:polygon(0 100%,0 70%,9% 40%,18% 62%,30% 18%,41% 58%,52% 34%,63% 66%,74% 30%,86% 60%,94% 44%,100% 64%,100% 100%)}
.degraus{position:absolute;left:9%;right:9%;top:calc(var(--hz) - 30px);height:46px;border-radius:50% 50% 0 0/100% 100% 0 0;
  background:repeating-linear-gradient(180deg,#e9e2d2 0 10px,#cfc6b2 10px 12px,#ddd5c3 12px 22px,#bfb59f 22px 24px)}
.coluna{position:absolute;top:22px;width:38px;height:calc(var(--hz) + 78px);border-radius:3px;
  background:linear-gradient(90deg,#b9b09c 0,#f4efe5 18%,#d9d2c2 34%,#f6f2e9 50%,#d3cbb9 66%,#efe9dd 82%,#a79e8a 100%);box-shadow:4px 0 10px rgba(60,40,20,.25)}
.coluna::before,.coluna::after{content:"";position:absolute;left:-8px;right:-8px;height:12px;border-radius:3px;background:linear-gradient(180deg,#faf7f0,#cfc7b5);box-shadow:0 2px 0 #a79e8a}
.coluna::before{top:-8px}.coluna::after{bottom:-6px}
.coluna.e{left:22px}.coluna.d{right:22px}
/* coro grego */
.coro{position:absolute;left:12%;right:12%;top:calc(var(--hz) - 44px);height:50px;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.corista{position:relative;width:15px;height:25px;border-radius:7px 7px 2px 2px;background:#4a3024;flex:none;transform-origin:50% 100%}
.corista::before{content:"";position:absolute;left:50%;top:-10px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:inherit}
.corista:nth-child(2n){height:30px;background:#5d3b28}.corista:nth-child(3n){background:#3a251d;height:27px}.corista:nth-child(5n){background:#70472f}
.coro.aplauso .corista{animation:coroPula .34s var(--tranco) infinite alternate;animation-delay:calc(var(--i)*-70ms)}
.coro.vaia .corista{animation:coroNega .2s linear infinite alternate;animation-delay:calc(var(--i)*-45ms)}
.coro.murmurio .corista{animation:coroBalanca .7s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-130ms)}
@keyframes coroPula{from{transform:translateY(0)}to{transform:translateY(-9px) scaleY(1.06)}}
@keyframes coroNega{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes coroBalanca{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.coro-fala{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);background:#fffdf5;color:var(--tinta);border:2px solid #4a3024;border-radius:14px;padding:2px 14px 3px;font-family:var(--serif);font-style:italic;font-weight:700;font-size:16px;white-space:nowrap;opacity:0;pointer-events:none}
.coro-fala::before{content:"Coro";font-family:var(--sans);font-style:normal;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--tinta2);margin-right:8px;vertical-align:1px}
.coro.falando .coro-fala{opacity:1;animation:coroFala .28s var(--tranco)}
@keyframes coroFala{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.8)}}

/* piso em perspectiva */
.cena3d{position:relative;perspective:1500px;perspective-origin:50% 0;padding:0 46px;margin-top:calc(var(--hz) - 52px)}
.plano{position:relative;transform:rotateX(var(--tilt));transform-origin:50% 100%;transform-style:preserve-3d;display:flex;flex-direction:column;gap:14px;padding:16px 14px 18px}
.plano .opps,.plano .panel,.plano .group,.plano .agora{transform-style:preserve-3d}
.piso{position:absolute;inset:0;border-radius:10px;box-shadow:0 0 0 3px #cfc6b2,0 0 0 9px #a89f8c,0 30px 40px rgba(60,40,20,.35);
  background:
    linear-gradient(115deg,transparent 0 46%,rgba(150,140,120,.2) 46.2%,transparent 46.9%),
    linear-gradient(68deg,transparent 0 71%,rgba(150,140,120,.16) 71.2%,transparent 71.7%),
    linear-gradient(152deg,transparent 0 23%,rgba(150,140,120,.14) 23.2%,transparent 23.6%),
    repeating-linear-gradient(0deg,transparent 0 129px,rgba(120,110,90,.28) 129px 130px),
    repeating-linear-gradient(90deg,transparent 0 129px,rgba(120,110,90,.28) 129px 130px),
    radial-gradient(ellipse at 50% 48%,#fbf8f1 0,var(--marmore) 46%,var(--marmore2) 100%)}
.orquestra{position:absolute;left:8%;right:8%;top:24%;bottom:26%;border-radius:50%;border:3px solid rgba(200,150,42,.55);box-shadow:inset 0 0 0 10px rgba(200,150,42,.1),inset 0 0 60px rgba(200,150,42,.12)}
.veu{position:absolute;inset:0;border-radius:10px;background:rgba(30,26,40,.5);pointer-events:none;opacity:0;transition:opacity .14s;transform:translateZ(1px)}
body.escolhendo .veu{opacity:1}

.panel{position:relative;background:rgba(255,255,255,.34);border:1px solid rgba(120,110,90,.35);border-radius:12px;padding:8px 12px 9px}
.opps{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.opps{grid-template-columns:1fr}}
.ptitle{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.3px}
.ptitle .dot{width:14px;height:14px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.25)}
.ptitle .pts{margin-left:auto;font-family:var(--serif);font-size:24px;font-weight:900;line-height:1;border-bottom:4px solid var(--pc);padding:0 2px}
.ptitle .pts small{font-family:var(--sans);font-size:11px;color:var(--tinta2);font-weight:700;margin-left:3px}
.pmeta{color:var(--tinta2);font-size:13px;font-weight:500;font-family:var(--sans);letter-spacing:0}
.pmeta.rodape{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel.vez{border-color:var(--pc);box-shadow:0 0 0 3px var(--pc),0 0 34px 2px var(--pc)}
.group{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;min-height:60px;border-radius:12px;padding:3px}
.me .group{justify-content:center;gap:16px}
.vazio{--w:100px;border:2px dashed rgba(90,80,60,.4);border-radius:10px;width:var(--w);height:calc(var(--w)*.8);display:flex;align-items:center;justify-content:center;color:rgba(60,50,35,.55);font-size:12px;text-align:center;font-weight:700}
.opp .vazio{--w:78px}
.trofeus{display:inline-flex;gap:4px;align-items:center;margin-left:auto}
.ptitle .trofeus{margin-left:6px}
.trofeus .tl{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--tinta2);margin-right:2px}
.trofeus .tv{font-size:12.5px;color:var(--tinta2)}
.trofeu{width:23px;height:23px;border-radius:5px;background:var(--c);color:#fff;font-family:var(--serif);font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.trofeu.porvir{visibility:hidden}
.trofeu.chegou{animation:trofeu .5s var(--tranco)}
@keyframes trofeu{from{transform:scale(2.6)}}

/* cartas de pé */
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;--w:100px;transform:rotateX(calc(-1*var(--tilt)));transform-origin:50% 100%}
.opp .seat{--w:78px}
.mini{position:relative;width:var(--w);height:calc(var(--w)*1.38);border-radius:10px;border:2px solid var(--e2,#444);background:var(--paper);color:var(--paperink);padding:0;overflow:hidden;text-align:left;flex:none;touch-action:none;
  transform:perspective(520px) translateY(var(--up,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .14s var(--saida),box-shadow .14s;
  box-shadow:0 2px 0 #d8d0be,0 4px 0 #b9af9a,0 5px 0 #8f8674,0 12px 14px rgba(40,25,10,.4)}
.mini:hover{--up:-6px;box-shadow:0 2px 0 #d8d0be,0 4px 0 #b9af9a,0 5px 0 #8f8674,0 20px 20px rgba(40,25,10,.38)}
.mini .img{position:absolute;inset:0 0 38% 0;background-size:cover;background-position:50% 18%;background-color:#555}
.mini .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12) 0,transparent 30%,transparent 55%,var(--e2) 100%)}
.mini .custo{position:absolute;left:4px;top:4px;min-width:23px;height:23px;border-radius:7px;background:#fff;border:2px solid var(--e2);font-family:var(--serif);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:2}
.mini .nome{position:absolute;left:0;right:0;top:62%;transform:translateY(-100%);padding:2px 6px;color:#fff;font-family:var(--serif);font-weight:900;font-size:calc(var(--w)*.125);text-shadow:0 1px 3px #000;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .vals{position:absolute;left:0;right:0;bottom:0;height:38%;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;background:var(--e2)}
.mini .vals span{border-radius:5px;background:var(--c);color:#fff;font-weight:800;font-size:calc(var(--w)*.115);display:flex;align-items:center;justify-content:center;opacity:.78}
.mini .vals span.on{opacity:1;box-shadow:0 0 0 1.5px #fff inset}
.mini .sel{position:absolute;left:0;right:0;top:30%;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;text-align:center;z-index:3;line-height:13px;background:rgba(0,0,0,.72);color:#fff;display:block;margin:0}
.mini.novo{opacity:.55;filter:grayscale(.75)}
.mini.acted .img{filter:grayscale(.85) brightness(.7)}
.mini.ausente{opacity:.22}
.mini.P{border-color:#5a4a2c;background:linear-gradient(180deg,#fbf6ea,#eadfc6)}
.mini.P .pt{padding:29px 7px 0;font-family:var(--serif);font-weight:900;font-size:13.5px;line-height:1.05}
.mini.P .ps{padding:2px 7px;font-size:10px;color:#7a6a45;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.mini.P .pd{padding:2px 7px;font-size:10.5px;line-height:1.15;color:#3d372b}
.mini.P .custo{border-color:#5a4a2c}
.mini.caro{opacity:.7}
.mini.brilho{animation:brilho 1.1s ease-out}
@keyframes brilho{0%{box-shadow:0 0 0 0 rgba(255,236,150,.95),0 0 0 0 var(--bc,#e9b93f)}100%{box-shadow:0 0 0 14px rgba(255,236,150,0),0 0 30px 6px transparent}}
.backs{display:flex;gap:3px;align-items:center}
.back{width:13px;height:18px;border-radius:3px;background:repeating-linear-gradient(45deg,#7a2f2f,#7a2f2f 3px,#5c2020 3px,#5c2020 6px);border:1px solid #c9a24a}

/* livros = ideias (junto ao filósofo) */
.liv{display:inline-block;width:5px;height:14px;border-radius:1.5px 1.5px 0 0;background:var(--pc);box-shadow:inset -1.5px 0 rgba(0,0,0,.32),inset 0 2px rgba(255,255,255,.4);flex:none}
.liv:nth-child(3n){height:12px}.liv:nth-child(4n+1){height:15px}.liv:nth-child(5n){margin-right:4px}
.pilha{display:flex;align-items:flex-end;gap:1px;height:20px;width:var(--w);padding:0 4px 2px;border-bottom:4px solid var(--wood);border-radius:0 0 3px 3px;box-shadow:0 2px 0 var(--wood2)}
.pilha b{margin-left:auto;font-family:var(--serif);font-weight:900;font-size:15px;line-height:1;color:var(--tinta);align-self:center}
.pilha .mais{font-size:11px;color:var(--tinta2);align-self:center;margin-left:2px}
.pilha.zero b{color:rgba(60,50,35,.4)}
.quick{display:flex;gap:4px;height:26px}

/* tribunas: lápide com a pergunta e uma torre de livros por jogador */
.ag-h{position:relative;text-align:center;font-size:12.5px;color:var(--tinta2);margin:-4px 0 -6px;letter-spacing:.2px}
.ag-h b{font-family:var(--serif);font-size:15px;color:var(--ouro2);letter-spacing:2px;text-transform:uppercase;margin-right:8px}
.agora{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:end;padding:0 10px}
@media(max-width:780px){.agora{grid-template-columns:1fr}}
.trib{transform:rotateX(calc(-1*var(--tilt)));transform-origin:50% 100%;--pe:42px}
.deb{position:relative;display:flex;flex-direction:column;border-radius:10px;transition:box-shadow .14s,filter .14s}
.lapide{position:relative;border-radius:10px 10px 3px 3px;border-top:7px solid var(--c);background:linear-gradient(180deg,#fdfbf6,#e9e2d3);padding:6px 56px 9px 11px;min-height:74px;
  box-shadow:0 2px 0 #cfc6b2,0 5px 0 #a89f8c,0 10px 16px rgba(40,25,10,.3)}
.lapide .area{color:var(--c);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.9px;filter:brightness(.8)}
.lapide .valor{position:absolute;right:8px;top:7px;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--c);font-family:var(--serif);font-weight:900;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.lapide .q{font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.1;margin-top:2px;text-wrap:balance}
.torres{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:16px 6px 0;margin:0 6px;background:linear-gradient(180deg,rgba(255,255,255,.0) 0,rgba(255,255,255,.5) 100%);border-radius:0 0 8px 8px}
.linha{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--ouro);pointer-events:none}
.linha.vence{bottom:calc(var(--pe) + var(--v)*var(--bh))}
.linha.topo{bottom:calc(var(--pe) + 2*var(--v)*var(--bh));border-top:2px solid var(--ouro2)}
.linha em{position:absolute;right:0;bottom:1px;font-style:normal;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ouro2);background:rgba(255,252,244,.85);padding:0 4px;border-radius:3px 3px 0 0;white-space:nowrap}
.est{display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:0 2px 2px}
.torre{position:relative;width:54px;height:calc(2*var(--v)*var(--bh));display:flex;flex-direction:column-reverse;align-items:center;border-bottom:5px solid #cfc6b2;box-shadow:0 3px 0 #9a917f;box-sizing:content-box}
.lv{position:relative;flex:none;width:44px;height:var(--bh);border-radius:1.5px;background:var(--pc);box-shadow:inset 0 -1.5px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.45),inset 7px 0 rgba(0,0,0,.12)}
.lv::after{content:"";position:absolute;right:-5px;top:1px;bottom:1px;width:5px;background:repeating-linear-gradient(180deg,#fffaf0 0 1px,#d9cfb8 1px 2px);border-radius:0 1px 1px 0}
.lv:nth-child(3n+1){transform:translateX(-3px)}.lv:nth-child(4n+2){transform:translateX(3px) rotate(.8deg)}.lv:nth-child(5n){width:40px}.lv:nth-child(7n+3){transform:translateX(-1px) rotate(-1.2deg);width:46px}

.ret{position:relative}
.ret .rc{position:absolute;left:10px;top:10px;width:40px;height:40px;border-radius:10px;background:#fff;color:#23201a;border:3px solid var(--e1);font-family:var(--serif);font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.fala .jogada{margin:-16px -20px 12px;padding:9px 20px;border-radius:18px 18px 0 0;background:#efe5cc;border-bottom:2px solid var(--pc);font-size:15px}
.fala .jogada b{color:#23201a}
.fala .jogada span{display:block;font-size:13px;color:#6d6657;margin-top:1px}
.rot{font-family:var(--sans);font-weight:700;font-size:12px;color:#8b8577;text-transform:uppercase;letter-spacing:1px;margin-right:8px;vertical-align:2px}
.big .conc .rot{font-size:10px;margin-right:6px}
.fala .refl{margin-top:8px;padding-top:8px;border-top:1px solid #e3d9bd;font-size:15px}
.fala .refl ul{margin:4px 0 0;padding-left:20px}
.fala .refl li{margin:2px 0}
.fala .refl .peq{font-size:13px;color:#6d6657}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

/* ===== rodada visual 2: uma só luz (sol poente, à direita), materiais, cerâmica, câmera, marionetes ===== */
.mesa{--mx:0}
.sol{transform:translateX(calc(var(--mx)*-16px))}
.monte{transform:translateX(calc(var(--mx)*-9px))}
.degraus,.coro{transform:translateX(calc(var(--mx)*-4px))}
.coluna{transform:translateX(calc(var(--mx)*10px));background:linear-gradient(90deg,#8f8674 0,#b9b09c 14%,#d9d2c2 34%,#efe9dd 58%,#fbf8f1 78%,#fff 88%,#e9e2d3 100%);box-shadow:-10px 6px 14px rgba(60,40,20,.28)}
.mini{box-shadow:-1px 2px 0 #d8d0be,-2px 4px 0 #b9af9a,-3px 5px 0 #8f8674,-12px 12px 14px rgba(40,25,10,.38)}
.mini:hover{box-shadow:-1px 2px 0 #d8d0be,-2px 4px 0 #b9af9a,-3px 5px 0 #8f8674,-18px 20px 20px rgba(40,25,10,.34)}
.lapide{box-shadow:-1px 2px 0 #cfc6b2,-3px 5px 0 #a89f8c,-12px 10px 16px rgba(40,25,10,.3)}
.piso{box-shadow:0 0 0 3px #f6f2e9,0 0 0 8px #cfc6b2,0 0 0 11px #9a917f,-14px 34px 40px rgba(60,40,20,.4)}
.piso::after{content:"";position:absolute;inset:7px;border-radius:6px;border:2px solid #a8782a;box-shadow:inset 0 0 0 1px rgba(255,236,170,.6),0 0 0 1px rgba(90,60,10,.3)}
.orquestra{border:2px solid rgba(168,120,42,.7);box-shadow:inset 0 0 0 7px rgba(239,234,224,.5),inset 0 0 0 9px rgba(168,120,42,.45),inset 0 0 70px rgba(200,150,42,.1)}
.bib{border:3px solid #6b4a2a;box-shadow:inset 0 0 0 2px #2a1b0d,-3px 4px 6px rgba(40,25,10,.35)}
.torre{transform-origin:50% 100%}
.torre.lider{filter:none}
.torre.lider::before{content:"";position:absolute;left:-12px;right:-12px;bottom:0;height:200px;background:linear-gradient(180deg,rgba(255,224,140,0) 0,rgba(255,224,140,.42) 100%);clip-path:polygon(30% 0,100% 0,100% 100%,0 100%);transform:skewX(-16deg);transform-origin:50% 100%;pointer-events:none}
.focoveu{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .5s var(--saida);background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),transparent 0,transparent 170px,rgba(24,18,34,.5) 400px)}
.focoveu.on{opacity:1}
/* oponentes: busto e placa de bronze; clepsidra */
.busto{display:inline-flex;filter:drop-shadow(-2px 2px 1px rgba(40,25,10,.35))}
.placa-nome{background:linear-gradient(180deg,#c9973a,#8f6a16);color:#fff8e0;border:1px solid #6b4d0c;border-radius:3px;padding:0 10px 1px;font-size:15px;letter-spacing:.6px;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,236,170,.6)}
.btn.clep{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#d9a94a,#a8782a);border-color:#6b4d0c;border-bottom-color:#4f3808;color:#241803;box-shadow:inset 0 1px 0 rgba(255,236,170,.7)}
/* efeitos em pergaminho e cerâmica: sem estouros, o humor fica no ritmo */
.estouro{position:absolute;font-family:var(--serif);font-style:italic;font-weight:700;font-size:16px;color:#2a1a14;white-space:nowrap;z-index:3;background:linear-gradient(180deg,#f6ecd2,#ead9b0);padding:3px 20px 4px;border-radius:2px;box-shadow:0 3px 8px rgba(40,25,10,.3)}
.estouro::before,.estouro::after{content:"";position:absolute;top:-3px;bottom:-3px;width:9px;border-radius:5px;background:linear-gradient(90deg,#c9b27a,#f3e6c0 45%,#b89a5c);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.estouro::before{left:-5px}.estouro::after{right:-5px}
.estouro.medio{font-size:17px}
.estouro.escrachado{font-size:18px;font-style:normal;font-weight:900;font-variant:small-caps;letter-spacing:.8px}
.carimbo{border:3px double var(--vinho);font-family:var(--serif);font-size:21px;letter-spacing:3px;font-variant:small-caps;text-transform:none;border-radius:4px;background:rgba(255,248,240,.82);padding:1px 14px 3px}
.corista{background:#1e130e}.corista:nth-child(2n){background:#2a1a14}.corista:nth-child(3n){background:#1e130e}.corista:nth-child(5n){background:#3a2418}
.coro-fala{background:#d98a52;color:#1e130e;border:2px solid #1e130e;border-radius:3px;box-shadow:0 0 0 2px #d98a52,0 0 0 3px #1e130e}
.coro-fala::before{color:#1e130e;opacity:.75}
.papiro{position:absolute;left:0;top:0;width:18px;height:9px;margin:-4px 0 0 -9px;border-radius:4px;background:linear-gradient(180deg,#f6ecd2,#d9c48f);border:1px solid #8a6a3a;box-shadow:inset 4px 0 0 -1px #c9b27a,inset -4px 0 0 -1px #c9b27a;z-index:3}
/* marionete no pedestal */
.mini.boneco{background:none;border:0;box-shadow:none;overflow:visible;height:auto;display:flex;flex-direction:column;align-items:center}
.mini.boneco:hover{box-shadow:none}
.mini.boneco .fig{width:100%;margin-bottom:-5px;position:relative;z-index:1;filter:drop-shadow(-5px 4px 3px rgba(40,25,10,.35))}
.mini.boneco .fig svg{display:block;width:100%;height:auto;overflow:visible}
.mini.boneco .pedestal{position:relative;width:100%;border-radius:4px;background:linear-gradient(90deg,#b9b09c,#efe9dd 30%,#fbf8f1 75%,#e2dbcc);border:1px solid #9a917f;box-shadow:0 -3px 0 #fbf8f1,0 -4px 0 #9a917f,-2px 3px 0 #9a917f,-8px 8px 10px rgba(40,25,10,.3);padding:5px 4px 4px;text-align:center}
.mini.boneco .pn{display:block;font-family:var(--serif);font-weight:900;font-size:calc(var(--w)*.13);color:var(--tinta);line-height:1.1}
.mini.boneco .custo{left:-5px;top:-10px;min-width:20px;height:20px;font-size:13px}
.mini.boneco .vals{position:static;height:auto;background:none;padding:3px 0 0;grid-template-columns:repeat(4,1fr);gap:2px}
.mini.boneco .vals span{height:calc(var(--w)*.16);font-size:calc(var(--w)*.105)}
.mini.boneco .sel{top:44%}
.mini.boneco.acted .fig{filter:grayscale(.7) drop-shadow(-5px 4px 3px rgba(40,25,10,.3))}
.mini.boneco.ausente{opacity:1}
.mini.boneco.ausente .bn .figura{opacity:0}
.fantasma-fx.boneco .pedestal,.fantasma-fx.boneco .sel{visibility:hidden}
.fantasma-fx.boneco .bn .animal{display:none}
/* motor de marionetes: o desenho é fixo, o programa só gira e desloca as partes */
.bn g,.bn .palpebra{transform-box:view-box}
.bn .corpo{animation:bnResp 3.2s ease-in-out infinite alternate}
.bn .cabeca{animation:bnCab 4.6s ease-in-out infinite alternate}
.bn .palpebra{animation:bnPisca 4.4s infinite}
.bn .pendulo{animation:bnPend 2.3s ease-in-out infinite alternate}
.bn .braco-d{animation:bnBraco 3.8s ease-in-out infinite alternate}
.bn .rabo{animation:bnRabo .3s ease-in-out infinite alternate}
@keyframes bnResp{to{transform:translateY(-1.3px)}}
@keyframes bnCab{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes bnPisca{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes bnPend{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes bnBraco{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes bnRabo{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
.anda .bn .perna-e{animation:bnPasso .36s ease-in-out infinite alternate}
.anda .bn .perna-d{animation:bnPasso .36s ease-in-out infinite alternate-reverse}
.anda .bn .corpo{animation:bnBob .18s ease-in-out infinite alternate}
.anda .bn .pendulo{animation-duration:.5s}
.lanca .bn .braco-e{animation:bnLanca .46s ease-in-out infinite}
@keyframes bnPasso{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
@keyframes bnBob{to{transform:translateY(-2.6px)}}
@keyframes bnLanca{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-105deg)}}
</style>
</head>
